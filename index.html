<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Lookup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* Layout: one centred column. Search on top, current conditions as the focal block,
     7-day strip below, then the exact API request the page just made. */
  :root {
    --bg: #f3f6f9;
    --surface: #ffffff;
    --fg: #16212e;
    --muted: #5b6b7d;
    --line: #d9e1ea;
    --accent: #1f5fbf;
    --accent-fg: #ffffff;
    --warn: #b3421c;
    --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1722; --surface: #18222f; --fg: #e6edf5; --muted: #93a3b5;
      --line: #2a3747; --accent: #6ea8ff; --accent-fg: #0b1420; --warn: #ff9a73;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 var(--font-body);
    padding: 32px 16px 48px;
  }
  main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  h1 { font: 600 1.6rem/1.2 var(--font-display); margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="search"] {
    flex: 1 1 220px; min-width: 0; padding: 10px 12px; font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  }
  button, select {
    font: 500 1rem var(--font-body); padding: 10px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  }
  button[type="submit"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .matches { display: flex; flex-wrap: wrap; gap: 8px; }
  .matches button { padding: 6px 12px; font-size: 0.9rem; }
  .matches button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .status { color: var(--muted); min-height: 1.5em; margin: 0; }
  .status.error { color: var(--warn); }

  .now {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between;
  }
  .place { font: 600 1.15rem var(--font-display); margin: 0; }
  .temp { font: 600 4rem/1 var(--font-display); font-variant-numeric: tabular-nums; margin: 8px 0 4px; }
  .cond { margin: 0; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 4px 16px; font-variant-numeric: tabular-nums; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-weight: 500; }

  h2 { font: 600 0.8rem var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; }
  .day {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 10px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .day .d { font-weight: 600; }
  .day .c { color: var(--muted); font-size: 0.82rem; min-height: 2.4em; margin: 4px 0; }
  .day .lo { color: var(--muted); }
  .day .rain { font-size: 0.82rem; color: var(--accent); margin-top: 4px; }

  pre {
    margin: 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; font: 0.82rem/1.5 var(--font-mono); white-space: pre-wrap; word-break: break-all;
  }
  footer { color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Weather Lookup</h1>
    <p class="sub">Type a city. The page asks the Open-Meteo API and shows what comes back.</p>
  </header>

  <form id="search-form">
    <input type="search" id="city" placeholder="City name, e.g. Lisbon" value="Tokyo" autocomplete="off" aria-label="City name" required>
    <select id="units" aria-label="Units">
      <option value="metric">°C, km/h</option>
      <option value="imperial">°F, mph</option>
    </select>
    <button type="submit">Get weather</button>
  </form>

  <div class="matches" id="matches" aria-label="Matching places"></div>
  <p class="status" id="status" role="status"></p>

  <section class="now" id="now" hidden>
    <div>
      <p class="place" id="place"></p>
      <p class="temp" id="temp"></p>
      <p class="cond" id="cond"></p>
    </div>
    <dl>
      <dt>Feels like</dt><dd id="feels"></dd>
      <dt>Humidity</dt><dd id="humidity"></dd>
      <dt>Wind</dt><dd id="wind"></dd>
      <dt>Observed</dt><dd id="observed"></dd>
    </dl>
  </section>

  <section id="forecast" hidden>
    <h2>Next 7 days</h2>
    <div class="days" id="days"></div>
  </section>

  <section id="request" hidden>
    <h2>The request this page just made</h2>
    <pre id="url"></pre>
  </section>

  <footer>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a>.</footer>
</main>

<script>
// ---------- 1. Configuration ----------
const GEOCODE_URL  = "https://geocoding-api.open-meteo.com/v1/search";
const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";

// WMO weather codes -> plain words (the API returns a number, not text)
const WMO = {
  0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Rime fog",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
  56: "Freezing drizzle", 57: "Freezing drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain",
  66: "Freezing rain", 67: "Freezing rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
  80: "Light showers", 81: "Showers", 82: "Violent showers",
  85: "Snow showers", 86: "Heavy snow showers",
  95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, heavy hail"
};

const $ = id => document.getElementById(id);
let currentPlace = null;

// ---------- 2. Generic helper: call an API and return JSON ----------
async function getJSON(base, params) {
  const url = base + "?" + new URLSearchParams(params);
  const res = await fetch(url);
  if (!res.ok) throw new Error("The weather service answered with status " + res.status + ".");
  return { url, data: await res.json() };
}

// ---------- 3. Step one: city name -> coordinates ----------
async function findPlaces(name) {
  const { data } = await getJSON(GEOCODE_URL, { name, count: 5, language: "en", format: "json" });
  return data.results || [];
}

// ---------- 4. Step two: coordinates -> weather ----------
async function getWeather(place, units) {
  const params = {
    latitude: place.latitude,
    longitude: place.longitude,
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
    timezone: "auto"
  };
  if (units === "imperial") {
    params.temperature_unit = "fahrenheit";
    params.wind_speed_unit = "mph";
  }
  return getJSON(FORECAST_URL, params);
}

// ---------- 5. Put the answer on the page ----------
function render(place, data, url) {
  const c = data.current, u = data.current_units, d = data.daily;
  $("place").textContent = [place.name, place.admin1, place.country].filter(Boolean).join(", ");
  $("temp").textContent = Math.round(c.temperature_2m) + u.temperature_2m;
  $("cond").textContent = WMO[c.weather_code] || "Code " + c.weather_code;
  $("feels").textContent = Math.round(c.apparent_temperature) + u.apparent_temperature;
  $("humidity").textContent = c.relative_humidity_2m + u.relative_humidity_2m;
  $("wind").textContent = Math.round(c.wind_speed_10m) + " " + u.wind_speed_10m;
  $("observed").textContent = c.time.replace("T", " ") + " local";

  const days = $("days");
  days.replaceChildren();
  d.time.forEach((iso, i) => {
    const el = document.createElement("div");
    el.className = "day";
    const label = new Date(iso + "T00:00").toLocaleDateString("en", { weekday: "short", day: "numeric" });
    const rain = d.precipitation_probability_max[i];
    for (const [cls, text] of [
      ["d", label],
      ["c", WMO[d.weather_code[i]] || ""],
      ["hi", Math.round(d.temperature_2m_max[i]) + "°"],
      ["lo", Math.round(d.temperature_2m_min[i]) + "°"],
      ["rain", rain == null ? "" : rain + "% rain"]
    ]) {
      const p = document.createElement("div");
      p.className = cls; p.textContent = text; el.append(p);
    }
    days.append(el);
  });

  $("url").textContent = url;
  $("now").hidden = $("forecast").hidden = $("request").hidden = false;
}

function setStatus(text, isError) {
  $("status").textContent = text;
  $("status").classList.toggle("error", !!isError);
}

async function showWeather(place) {
  currentPlace = place;
  setStatus("Loading weather for " + place.name + "…");
  try {
    const { url, data } = await getWeather(place, $("units").value);
    render(place, data, url);
    setStatus("");
  } catch (err) {
    setStatus(err.message || "Could not reach the weather service. Check your connection and try again.", true);
  }
}

function renderMatches(places) {
  const box = $("matches");
  box.replaceChildren();
  if (places.length < 2) return;
  places.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = [p.name, p.admin1, p.country_code].filter(Boolean).join(", ");
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      showWeather(p);
    });
    box.append(b);
  });
}

// ---------- 6. Wire up the form ----------
async function search() {
  const name = $("city").value.trim();
  if (!name) return;
  setStatus("Looking up " + name + "…");
  try {
    const places = await findPlaces(name);
    if (!places.length) {
      renderMatches([]);
      setStatus('No place found called "' + name + '". Check the spelling or try a larger nearby city.', true);
      return;
    }
    renderMatches(places);
    await showWeather(places[0]);
  } catch (err) {
    setStatus(err.message || "Could not reach the weather service. Check your connection and try again.", true);
  }
}

$("search-form").addEventListener("submit", e => { e.preventDefault(); search(); });
$("units").addEventListener("change", () => { if (currentPlace) showWeather(currentPlace); });
search(); // load the example city on open
</script>
</body>
</html>
